services:
  rabbitmq:
    image: rabbitmq:3.13-management
    hostname: pulsestream-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: pulsestream
      RABBITMQ_DEFAULT_PASS: pulsestream
    ports:
      - "5672:5672"
      - "15672:15672"

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: pulsestream
      POSTGRES_USER: pulsestream
      POSTGRES_PASSWORD: pulsestream
    ports:
      - "5432:5432"
    volumes:
      - pulsestream-postgres:/var/lib/postgresql/data

volumes:
  pulsestream-postgres:
